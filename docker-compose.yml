services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cctv
      POSTGRES_USER: cctv
      POSTGRES_PASSWORD: cctv
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/cctv
      DB_USER: cctv
      DB_PASSWORD: cctv
    ports:
      - "8080:8080"
    depends_on:
      - db

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"

volumes:
  dbdata:
