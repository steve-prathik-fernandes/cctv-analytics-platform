services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cctv
      POSTGRES_USER: cctv
      POSTGRES_PASSWORD: cctv
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/cctv
      DB_USER: cctv
      DB_PASSWORD: cctv
      # Local-only defaults. Real deployments set these from a secrets manager.
      JWT_SECRET: ${JWT_SECRET:-local-compose-only-secret-not-for-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cctv.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-dev-password}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-local-compose-only-service-token-0123456789}
      STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET:-local-compose-only-signing-secret-0123456789}
      DETECTION_URL: http://ml-service:8000
      STORAGE_TYPE: local
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    ports:
      - "8080:8080"
    depends_on:
      - db

  ml-service:
    build: ./ml-service
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:-local-compose-only-service-token-0123456789}
      API_BASE_URL: http://backend:8080
      STORAGE_TYPE: local
      STORAGE_DIR: /data/storage
    volumes:
      # Shared with the backend, standing in for the S3 bucket.
      - storage:/data/storage
    # No published port: only the backend calls the detection service (NFR-S8).

volumes:
  dbdata:
  storage:
