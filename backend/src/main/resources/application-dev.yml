# In-memory H2 so the backend runs without Postgres or Docker.
# PostgreSQL mode lets the same Flyway migrations run here and in production.
spring:
  datasource:
    url: jdbc:h2:mem:cctv;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    placeholders:
      json_type: json

# Development-only values. Never use these anywhere reachable from the internet.
app:
  auth:
    jwt-secret: dev-only-secret-change-me-0123456789abcdef
    bootstrap-admin:
      email: admin@cctv.local
      password: admin-dev-password
  storage:
    signing-secret: dev-only-media-signing-secret-0123456789
  detection:
    service-token: ${SERVICE_TOKEN:dev-only-service-token-change-me-0123456789}
