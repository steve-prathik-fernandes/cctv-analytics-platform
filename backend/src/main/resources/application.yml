# Default profile targets PostgreSQL (see docker-compose.yml).
# For a zero-setup local run without Docker, start with: --spring.profiles.active=dev
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cctv}
    username: ${DB_USER:cctv}
    password: ${DB_PASSWORD:cctv}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway (src/main/resources/db/migration)
    open-in-view: false
  flyway:
    placeholders:
      json_type: jsonb
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Hard limits enforced by the servlet container; app.upload.max-bytes gives the friendly error.
      max-file-size: 512MB
      max-request-size: 513MB
      file-size-threshold: 1MB

app:
  auth:
    # No default: the API will not start without a secret of at least 32 characters.
    jwt-secret: ${JWT_SECRET}
    token-ttl: 60m
    max-failed-logins: 5
    failed-login-window: 15m
    bootstrap-admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}

  storage:
    # local: a folder shared with the detection service (development, Docker Compose).
    # s3: a private bucket with server-side encryption (AWS). The detection service must match.
    type: ${STORAGE_TYPE:local}
    # Local storage only. The detection service reads the same folder (STORAGE_DIR).
    local-dir: ${STORAGE_DIR:../data/storage}
    # Local storage only: signs short-lived media links. No default: with type local the API
    # will not start without one.
    signing-secret: ${STORAGE_SIGNING_SECRET}
    link-ttl: 5m
    s3:
      bucket: ${S3_BUCKET:}
      region: ${AWS_REGION:us-east-1}
      # Optional. Set to use SSE-KMS with this key; empty means SSE-S3 (AES-256).
      kms-key-id: ${S3_KMS_KEY_ID:}
      # Optional. Only for an S3-compatible test server such as MinIO.
      endpoint: ${S3_ENDPOINT:}
  upload:
    max-bytes: 524288000   # 500 MB
  detection:
    base-url: ${DETECTION_URL:http://localhost:8000}
    # Shared with the detection service. No default: the API will not start without one.
    service-token: ${SERVICE_TOKEN}
    model-name: yolov8n
    frame-stride: 3
    min-confidence: 0.4

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
